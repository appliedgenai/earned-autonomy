<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1200" viewBox="0 0 1400 1200" font-family="Segoe UI,Arial,sans-serif"><defs><marker id="ateal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087B73"/></marker><marker id="ablue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#295FA7"/></marker><marker id="ared" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#AC4836"/></marker><marker id="aamber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#98621B"/></marker></defs><rect x="1" y="1" width="1398" height="1198" rx="18" fill="white" stroke="#D6E2EA"/><text x="48" y="63" font-size="36" fill="#173047" font-weight="700">One case. Different permissions. Explicit limits.</text><text x="48" y="102" font-size="21" fill="#52697B" font-weight="400">SC-42: investigate why an advisor service case is blocked and propose the next permitted step.</text><rect x="48" y="142" width="1304" height="104" rx="12" fill="#173047" stroke="none"/><text x="73" y="178" font-size="16" fill="#B5D3DF" font-weight="700">WHY AN AGENT?</text><text x="73" y="215" font-size="22" fill="white" font-weight="600">The next investigation step depends on evidence. A fixed account update remains a controlled workflow.</text><text x="68" y="290" font-size="16" fill="#52697B" font-weight="700">ACTION</text><text x="486" y="290" font-size="16" fill="#295FA7" font-weight="700">INITIAL MODE</text><text x="856" y="290" font-size="16" fill="#087B73" font-weight="700">ENFORCED BOUND / CEILING</text><rect x="48" y="312" width="1304" height="104" rx="12" fill="#EEF4FC" stroke="none"/><text x="68" y="369" font-size="24" fill="#173047" font-weight="600">Inspect relevant records</text><text x="486" y="369" font-size="21" fill="#295FA7" font-weight="600">Bounded read access</text><text x="856" y="353" font-size="20" fill="#52697B" font-weight="400">Only sources allowed for this actor/case</text><text x="856" y="384" font-size="20" fill="#52697B" font-weight="400">Data minimization and tool limits</text><rect x="48" y="431" width="1304" height="104" rx="12" fill="#E7F5F0" stroke="none"/><text x="68" y="488" font-size="24" fill="#173047" font-weight="600">Prepare resolution package</text><text x="486" y="488" font-size="21" fill="#295FA7" font-weight="600">Draft for review</text><text x="856" y="472" font-size="20" fill="#52697B" font-weight="400">Cite evidence and unresolved conflicts</text><text x="856" y="503" font-size="20" fill="#52697B" font-weight="400">No implied permission to write or send</text><rect x="48" y="550" width="1304" height="104" rx="12" fill="#EEF4FC" stroke="none"/><text x="68" y="607" font-size="24" fill="#173047" font-weight="600">Create linked follow-up case</text><text x="486" y="607" font-size="21" fill="#295FA7" font-weight="600">Human approval required</text><text x="856" y="591" font-size="20" fill="#52697B" font-weight="400">Specialist follow-up linked to SC-42</text><text x="856" y="622" font-size="20" fill="#52697B" font-weight="400">Selected types, queue, fields and limits</text><rect x="48" y="669" width="1304" height="104" rx="12" fill="#FCF3E2" stroke="none"/><text x="68" y="726" font-size="24" fill="#173047" font-weight="600">Update mailing address</text><text x="486" y="726" font-size="21" fill="#295FA7" font-weight="600">Exact human approval required</text><text x="856" y="710" font-size="20" fill="#52697B" font-weight="400">Verified intent, current rights and state</text><text x="856" y="741" font-size="20" fill="#52697B" font-weight="400">Approval ceiling retained in this design</text><text x="48" y="837" font-size="17" fill="#087B73" font-weight="700">HOW THE SAME ACTION CAN CHANGE: CREATE_INTERNAL_CASE</text><rect x="48" y="864" width="376" height="105" rx="12" fill="#E7F5F0" stroke="none"/><text x="72" y="906" font-size="25" fill="#173047" font-weight="700">Draft only</text><text x="72" y="940" font-size="20" fill="#52697B" font-weight="400">No case created</text><path d="M429 897 H504" fill="none" stroke="#087B73" stroke-width="3"  marker-end="url(#ateal)"/><rect x="512" y="864" width="376" height="105" rx="12" fill="#173047" stroke="none"/><text x="536" y="906" font-size="25" fill="white" font-weight="700">Approval required</text><text x="536" y="940" font-size="20" fill="#B5D3DF" font-weight="400">Exact proposal approved</text><path d="M893 897 H968" fill="none" stroke="#087B73" stroke-width="3"  marker-end="url(#ateal)"/><rect x="976" y="864" width="376" height="105" rx="12" fill="#E7F5F0" stroke="none"/><text x="1000" y="906" font-size="25" fill="#173047" font-weight="700">Bounded execution</text><text x="1000" y="940" font-size="20" fill="#52697B" font-weight="400">Approved cohort + limits</text><path d="M1160 982 V1010 H237 V982" fill="none" stroke="#AC4836" stroke-width="3"  marker-end="url(#ared)"/><text x="377" y="1041" font-size="21" fill="#AC4836" font-weight="600">Restrict or suspend the affected action; restore only after a recorded review.</text><text x="48" y="1096" font-size="21" fill="#52697B" font-weight="400">Expansion needs a versioned owner-approved grant and outcome evidence. Mandatory approvals remain binding.</text><path d="M48 1146 H1352" stroke="#D6E2EA"/><text x="48" y="1175" font-size="16" fill="#52697B" font-weight="400">Illustrative architecture · Synthetic case SC-42 · Permissions follow applicable policy</text><text x="1090" y="1175" font-size="16" fill="#52697B" font-weight="400">Mohit Mittal · 2026</text></svg>