<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" font-family="Segoe UI,Arial,sans-serif"><defs><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087B73"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#295FA7"/></marker><marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#98621B"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#AC4836"/></marker></defs><rect x="1" y="1" width="1398" height="1118" fill="white" stroke="#D6E2EA" rx="18"/><text x="48" y="63" font-size="34" fill="#173047" font-weight="700">Which actions may run without approval?</text><text x="48" y="104" font-size="21" fill="#536B7C" font-weight="400">Permission is scoped to action, cohort, actor, environment and validated configuration.</text><rect x="48" y="146" width="1304" height="79" fill="#173047" stroke="none" rx="13"/><text x="72" y="193" font-size="25" fill="white" font-weight="600">A model release changes behavior. An approved grant changes what may execute.</text><rect x="48" y="276" width="284" height="240" fill="#EEF4FC" stroke="none" rx="13"/><text x="72" y="322" font-size="31" fill="#295FA7" font-weight="700">A0</text><text x="72" y="364" font-size="23" fill="#173047" font-weight="700">Shadow</text><text x="72" y="411" font-size="20" fill="#536B7C" font-weight="400">Authorized investigation</text><text x="72" y="444" font-size="20" fill="#536B7C" font-weight="400">Simulated proposals</text><text x="72" y="477" font-size="20" fill="#536B7C" font-weight="400">No business effects</text><path d="M337 387 H382" stroke="#087B73" stroke-width="3" fill="none" marker-end="url(#teal)"/><rect x="388" y="276" width="284" height="240" fill="#EEF4FC" stroke="none" rx="13"/><text x="412" y="322" font-size="31" fill="#295FA7" font-weight="700">A1</text><text x="412" y="364" font-size="23" fill="#173047" font-weight="700">Propose</text><text x="412" y="411" font-size="20" fill="#536B7C" font-weight="400">Actionable draft</text><text x="412" y="444" font-size="20" fill="#536B7C" font-weight="400">Human decides next step</text><text x="412" y="477" font-size="20" fill="#536B7C" font-weight="400">Agent execution disabled</text><path d="M677 387 H722" stroke="#087B73" stroke-width="3" fill="none" marker-end="url(#teal)"/><rect x="728" y="276" width="284" height="240" fill="#FCF3E2" stroke="none" rx="13"/><text x="752" y="322" font-size="31" fill="#295FA7" font-weight="700">A2</text><text x="752" y="364" font-size="23" fill="#173047" font-weight="700">Approved execution</text><text x="752" y="411" font-size="20" fill="#536B7C" font-weight="400">Exact approval each time</text><text x="752" y="444" font-size="20" fill="#536B7C" font-weight="400">Fresh dispatch checks</text><text x="752" y="477" font-size="20" fill="#536B7C" font-weight="400">Verify or reconcile effect</text><path d="M1017 387 H1062" stroke="#087B73" stroke-width="3" fill="none" marker-end="url(#teal)"/><rect x="1068" y="276" width="284" height="240" fill="#E7F5F0" stroke="none" rx="13"/><text x="1092" y="322" font-size="31" fill="#295FA7" font-weight="700">A3</text><text x="1092" y="364" font-size="23" fill="#173047" font-weight="700">Bounded execution</text><text x="1092" y="411" font-size="20" fill="#536B7C" font-weight="400">Delegate eligible actions</text><text x="1092" y="444" font-size="20" fill="#536B7C" font-weight="400">Enforce scope and limits</text><text x="1092" y="477" font-size="20" fill="#536B7C" font-weight="400">Retain policy ceilings</text><text x="48" y="570" font-size="17" fill="#087B73" font-weight="700">EVIDENCE FOR THE NEXT PERMISSION</text><rect x="48" y="595" width="412" height="160" fill="#EEF4FC" stroke="none" rx="13"/><text x="71" y="633" font-size="24" fill="#173047" font-weight="700">A0 → A1</text><text x="71" y="673" font-size="21" fill="#536B7C" font-weight="400">Useful, grounded proposals</text><text x="71" y="703" font-size="21" fill="#536B7C" font-weight="400">Appropriate escalation</text><text x="71" y="733" font-size="21" fill="#536B7C" font-weight="400">Approved data handling</text><rect x="494" y="595" width="412" height="160" fill="#EEF4FC" stroke="none" rx="13"/><text x="517" y="633" font-size="24" fill="#173047" font-weight="700">A1 → A2</text><text x="517" y="673" font-size="21" fill="#536B7C" font-weight="400">Qualified execution and recovery</text><text x="517" y="703" font-size="21" fill="#536B7C" font-weight="400">Exact approval and current rights</text><text x="517" y="733" font-size="21" fill="#536B7C" font-weight="400">Staffed exceptions</text><rect x="940" y="595" width="412" height="160" fill="#E7F5F0" stroke="none" rx="13"/><text x="963" y="633" font-size="24" fill="#173047" font-weight="700">A2 → A3</text><text x="963" y="673" font-size="21" fill="#536B7C" font-weight="400">Same-action outcome evidence</text><text x="963" y="703" font-size="21" fill="#536B7C" font-weight="400">Policy allows delegated execution</text><text x="963" y="733" font-size="21" fill="#536B7C" font-weight="400">Capacity and net benefit</text><rect x="48" y="794" width="1304" height="102" fill="#173047" stroke="none" rx="13"/><text x="73" y="831" font-size="16" fill="#BDD6E1" font-weight="700">SC-42: MIXED PERMISSIONS ARE EXPECTED</text><text x="73" y="870" font-size="24" fill="white" font-weight="600">Specialist follow-up: A2 → possible A3.   Account update: A2, with approval retained.</text><rect x="48" y="927" width="1304" height="97" fill="#FCEFEB" stroke="none" rx="13"/><text x="73" y="963" font-size="17" fill="#AC4836" font-weight="700">SUSPENSION IS A SEPARATE CONTROL STATE</text><text x="73" y="999" font-size="21" fill="#AC4836" font-weight="400">Restrict affected new dispatches; confirm enforcement; reconcile in-flight work before closing the incident.</text><path d="M48 1064 H1352" stroke="#D6E2EA"/><text x="48" y="1093" font-size="16" fill="#536B7C" font-weight="400">Earned Autonomy · Operating architecture</text><text x="1092" y="1093" font-size="16" fill="#536B7C" font-weight="400">Mohit Mittal · 2026</text></svg>