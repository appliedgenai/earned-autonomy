<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1300" viewBox="0 0 1400 1300" font-family="Segoe UI,Arial,sans-serif"><defs><marker id="ateal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087B73"/></marker><marker id="ablue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#295FA7"/></marker><marker id="ared" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#AC4836"/></marker><marker id="aamber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#98621B"/></marker></defs><rect x="1" y="1" width="1398" height="1298" rx="18" fill="white" stroke="#D6E2EA"/><text x="48" y="63" font-size="36" fill="#173047" font-weight="700">Improve the system. Review its permission separately.</text><text x="48" y="102" font-size="21" fill="#52697B" font-weight="400">Operational evidence drives two governed decisions. A model or judge never promotes its own authority.</text><rect x="48" y="146" width="1304" height="109" rx="12" fill="#173047" stroke="none"/><text x="73" y="182" font-size="16" fill="#B5D3DF" font-weight="700">BOUNDED OPERATION</text><text x="73" y="222" font-size="25" fill="white" font-weight="600">Investigate → propose → required checks / approval → execute → verify or reconcile</text><rect x="48" y="331" width="365" height="177" rx="12" fill="#EEF4FC" stroke="none"/><text x="71" y="361" font-size="15" fill="#52697B" font-weight="700">OBSERVABILITY</text><text x="71" y="397" font-size="25" fill="#173047" font-weight="700">Evidence + review</text><text x="71" y="434" font-size="19" fill="#52697B" font-weight="400">Outcome and execution receipts</text><text x="71" y="462" font-size="19" fill="#52697B" font-weight="400">Human labels / accepted-case audits</text><text x="71" y="490" font-size="19" fill="#52697B" font-weight="400">Unknowns, incidents and effort</text><rect x="505" y="331" width="400" height="177" rx="12" fill="#E7F5F0" stroke="none"/><text x="528" y="361" font-size="15" fill="#52697B" font-weight="700">EVALUATION</text><text x="528" y="397" font-size="25" fill="#173047" font-weight="700">Code + judge + domain review</text><text x="528" y="434" font-size="19" fill="#52697B" font-weight="400">Current and held-out cases</text><text x="528" y="462" font-size="19" fill="#52697B" font-weight="400">Calibration + severity-specific errors</text><text x="528" y="490" font-size="19" fill="#52697B" font-weight="400">Versioned evidence, not one score</text><rect x="997" y="331" width="355" height="177" rx="12" fill="#FCEFEB" stroke="none"/><text x="1020" y="361" font-size="15" fill="#52697B" font-weight="700">DEFINED SEVERE TRIGGER</text><text x="1020" y="397" font-size="25" fill="#173047" font-weight="700">Restrict immediately</text><text x="1020" y="434" font-size="19" fill="#52697B" font-weight="400">Block affected new actions</text><text x="1020" y="462" font-size="19" fill="#52697B" font-weight="400">Reconcile work already in flight</text><text x="1020" y="490" font-size="19" fill="#52697B" font-weight="400">Record owner and recovery path</text><path d="M230 258 V327" fill="none" stroke="#087B73" stroke-width="3"  marker-end="url(#ateal)"/><path d="M415 419 H500" fill="none" stroke="#087B73" stroke-width="3"  marker-end="url(#ateal)"/><path d="M1190 258 V327" fill="none" stroke="#AC4836" stroke-width="3"  marker-end="url(#ared)"/><text x="976" y="295" font-size="17" fill="#AC4836" font-weight="600">Control event</text><path d="M1300 329 V259" fill="none" stroke="#AC4836" stroke-width="3"  marker-end="url(#ared)"/><text x="1227" y="291" font-size="16" fill="#AC4836" font-weight="600">Enforce</text><path d="M635 511 V558 H370 V599" fill="none" stroke="#087B73" stroke-width="3"  marker-end="url(#ateal)"/><path d="M778 511 V558 H1050 V599" fill="none" stroke="#087B73" stroke-width="3"  marker-end="url(#ateal)"/><rect x="48" y="603" width="626" height="336" rx="12" fill="#EEF4FC" stroke="none"/><text x="73" y="641" font-size="17" fill="#295FA7" font-weight="700">LOOP A · CHANGE BEHAVIOR</text><text x="73" y="684" font-size="27" fill="#173047" font-weight="700">Engineer + evaluation owner</text><text x="73" y="729" font-size="22" fill="#52697B" font-weight="400">Diagnose source, retrieval, prompt or tool failure.</text><text x="73" y="772" font-size="22" fill="#52697B" font-weight="400">Consider model change / training only when justified.</text><text x="73" y="815" font-size="22" fill="#52697B" font-weight="400">Use approved data and adjudicated labels.</text><text x="73" y="858" font-size="22" fill="#52697B" font-weight="400">Version candidate → held-out checks → rollout / rollback.</text><rect x="726" y="603" width="626" height="336" rx="12" fill="#FCF3E2" stroke="none"/><text x="750" y="641" font-size="17" fill="#98621B" font-weight="700">LOOP B · CHANGE AUTHORITY</text><text x="750" y="684" font-size="27" fill="#173047" font-weight="700">Business owner + risk partners</text><text x="750" y="729" font-size="21" fill="#52697B" font-weight="400">Review the same action, cohort and versions.</text><text x="750" y="772" font-size="21" fill="#52697B" font-weight="400">Retain / expand / restrict / suspend within policy ceilings.</text><text x="750" y="815" font-size="21" fill="#52697B" font-weight="400">Require recovery evidence before restoration.</text><text x="750" y="858" font-size="21" fill="#52697B" font-weight="400">Publish a versioned grant; retain required approvals.</text><path d="M48 770 H24 V201 H44" fill="none" stroke="#295FA7" stroke-width="3"  marker-end="url(#ablue)"/><path d="M1352 770 H1377 V201 H1357" fill="none" stroke="#98621B" stroke-width="3"  marker-end="url(#aamber)"/><text x="76" y="976" font-size="22" fill="#173047" font-weight="600">Changed behavior may require authority requalification. Better weights do not widen the grant.</text><rect x="48" y="1012" width="1304" height="179" rx="12" fill="#E7F5F0" stroke="none"/><text x="73" y="1049" font-size="16" fill="#087B73" font-weight="700">MEASURE WHAT SUPPORTS THE DECISION</text><text x="73" y="1091" font-size="22" fill="#52697B" font-weight="400">Unauthorized effects · incorrect completion · missed escalation · judge unsafe passes</text><text x="73" y="1128" font-size="22" fill="#52697B" font-weight="400">Unknown outcomes + age · valid evidence coverage · autonomous coverage + human effort</text><text x="73" y="1165" font-size="22" fill="#52697B" font-weight="400">Report by action, cohort and version. Keep denominators and observation windows explicit.</text><path d="M48 1245 H1352" stroke="#D6E2EA"/><text x="48" y="1274" font-size="16" fill="#52697B" font-weight="400">Illustrative architecture · Synthetic case SC-42 · Permissions follow applicable policy</text><text x="1090" y="1274" font-size="16" fill="#52697B" font-weight="400">Mohit Mittal · 2026</text></svg>