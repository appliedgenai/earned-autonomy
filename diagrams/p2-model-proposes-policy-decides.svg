<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1340" viewBox="0 0 1400 1340" font-family="Segoe UI,Arial,sans-serif"><defs><marker id="ateal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087B73"/></marker><marker id="ablue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#295FA7"/></marker><marker id="ared" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#AC4836"/></marker><marker id="aamber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#98621B"/></marker></defs><rect x="1" y="1" width="1398" height="1338" rx="18" fill="white" stroke="#D6E2EA"/><text x="48" y="63" font-size="36" fill="#173047" font-weight="700">From proposal to verified result</text><text x="48" y="102" font-size="21" fill="#52697B" font-weight="400">Human approval returns through fresh checks. Every write ends in a verified result or an owned exception.</text><rect x="48" y="154" width="380" height="170" rx="12" fill="#EEF4FC" stroke="none"/><text x="71" y="184" font-size="15" fill="#52697B" font-weight="700">SCOPED REASONING</text><text x="71" y="220" font-size="25" fill="#173047" font-weight="700">Investigate SC-42</text><text x="71" y="257" font-size="19" fill="#52697B" font-weight="400">Approved read connectors only</text><text x="71" y="285" font-size="19" fill="#52697B" font-weight="400">Case, actor and tool boundaries</text><text x="71" y="313" font-size="19" fill="#52697B" font-weight="400">Select next source or escalate</text><rect x="510" y="154" width="380" height="170" rx="12" fill="#EEF4FC" stroke="none"/><text x="533" y="184" font-size="15" fill="#52697B" font-weight="700">VERSIONED ARTIFACT</text><text x="533" y="220" font-size="25" fill="#173047" font-weight="700">Propose an exact action</text><text x="533" y="257" font-size="19" fill="#52697B" font-weight="400">Target + payload + source refs</text><text x="533" y="285" font-size="19" fill="#52697B" font-weight="400">Grant / policy refs + state version</text><text x="533" y="313" font-size="19" fill="#52697B" font-weight="400">Unresolved facts remain explicit</text><rect x="972" y="154" width="380" height="170" rx="12" fill="#F3EFF9" stroke="none"/><text x="995" y="184" font-size="15" fill="#52697B" font-weight="700">PROBABILISTIC ASSESSMENT</text><text x="995" y="220" font-size="25" fill="#173047" font-weight="700">Semantic judge</text><text x="995" y="257" font-size="19" fill="#52697B" font-weight="400">Rubric + evidence → verdict</text><text x="995" y="285" font-size="19" fill="#52697B" font-weight="400">Uncertainty / disagreement → review</text><text x="995" y="313" font-size="19" fill="#52697B" font-weight="400">Assessment cannot grant authority</text><path d="M430 232 H505" fill="none" stroke="#087B73" stroke-width="3"  marker-end="url(#ateal)"/><path d="M892 232 H968" fill="none" stroke="#087B73" stroke-width="3"  marker-end="url(#ateal)"/><path d="M700 327 V412" fill="none" stroke="#087B73" stroke-width="3"  marker-end="url(#ateal)"/><path d="M1160 328 V370 H935 V468 H895" fill="none" stroke="#087B73" stroke-width="3"  marker-end="url(#ateal)"/><text x="974" y="400" font-size="17" fill="#74559D" font-weight="600">Assessment + rubric revision</text><rect x="48" y="434" width="380" height="177" rx="12" fill="#FCF3E2" stroke="none"/><text x="71" y="464" font-size="15" fill="#52697B" font-weight="700">WHEN THE ACTION REQUIRES IT</text><text x="71" y="500" font-size="25" fill="#173047" font-weight="700">Accountable approver</text><text x="71" y="537" font-size="19" fill="#52697B" font-weight="400">Reviews exact effect and evidence</text><text x="71" y="565" font-size="19" fill="#52697B" font-weight="400">Binds approval to proposal + expiry</text><text x="71" y="593" font-size="19" fill="#52697B" font-weight="400">Changed proposal needs new review</text><rect x="510" y="416" width="380" height="212" rx="12" fill="#173047" stroke="none"/><text x="533" y="446" font-size="15" fill="#BCD5E0" font-weight="700">DETERMINISTIC DISPATCH GATE</text><text x="533" y="482" font-size="25" fill="white" font-weight="700">Fresh checks</text><text x="533" y="519" font-size="19" fill="#BCD5E0" font-weight="400">Current rights + grant + policy</text><text x="533" y="547" font-size="19" fill="#BCD5E0" font-weight="400">Required evidence and approval</text><text x="533" y="575" font-size="19" fill="#BCD5E0" font-weight="400">Target / state / expiry / limits</text><path d="M508 480 H432" fill="none" stroke="#98621B" stroke-width="3"  marker-end="url(#aamber)"/><text x="439" y="456" font-size="16" fill="#98621B" font-weight="700">ask</text><path d="M430 570 H505" fill="none" stroke="#98621B" stroke-width="3"  marker-end="url(#aamber)"/><text x="437" y="598" font-size="15" fill="#98621B" font-weight="700">approval</text><rect x="972" y="435" width="380" height="176" rx="12" fill="#FCEFEB" stroke="none"/><text x="995" y="471" font-size="15" fill="#AC4836" font-weight="700">IF A REQUIRED CHECK FAILS</text><text x="995" y="510" font-size="19" fill="#AC4836" font-weight="400">Hold, deny or request fresh review.</text><text x="995" y="539" font-size="19" fill="#AC4836" font-weight="400">No silent bypass on judge outage,</text><text x="995" y="568" font-size="19" fill="#AC4836" font-weight="400">missing evidence or policy failure.</text><path d="M892 538 H968" fill="none" stroke="#AC4836" stroke-width="3"  marker-end="url(#ared)"/><text x="922" y="523" font-size="15" fill="#AC4836" font-weight="700">stop</text><path d="M700 631 V727" fill="none" stroke="#087B73" stroke-width="3"  marker-end="url(#ateal)"/><text x="719" y="692" font-size="18" fill="#087B73" font-weight="600">Only after all required checks pass</text><rect x="510" y="731" width="380" height="170" rx="12" fill="#E7F5F0" stroke="none"/><text x="533" y="761" font-size="15" fill="#52697B" font-weight="700">DURABLE WORKFLOW</text><text x="533" y="797" font-size="25" fill="#173047" font-weight="700">Controlled executor</text><text x="533" y="834" font-size="19" fill="#52697B" font-weight="400">Operation ID + payload binding</text><text x="533" y="862" font-size="19" fill="#52697B" font-weight="400">Concurrency + safe retry contract</text><text x="533" y="890" font-size="19" fill="#52697B" font-weight="400">Stop / recovery state</text><rect x="972" y="731" width="380" height="170" rx="12" fill="#E7F5F0" stroke="none"/><text x="995" y="761" font-size="15" fill="#52697B" font-weight="700">SYSTEM OF RECORD</text><text x="995" y="797" font-size="25" fill="#173047" font-weight="700">Destination enforcement</text><text x="995" y="834" font-size="19" fill="#52697B" font-weight="400">Authorization + conditional write</text><text x="995" y="862" font-size="19" fill="#52697B" font-weight="400">Receipt / operation lookup</text><text x="995" y="890" font-size="19" fill="#52697B" font-weight="400">Destination guarantees required</text><path d="M892 814 H968" fill="none" stroke="#087B73" stroke-width="3"  marker-end="url(#ateal)"/><rect x="48" y="731" width="380" height="170" rx="12" fill="#FCEFEB" stroke="none"/><text x="71" y="761" font-size="15" fill="#52697B" font-weight="700">RESTRICTION / STOP CONTROL</text><text x="71" y="797" font-size="25" fill="#173047" font-weight="700">Prevent new dispatches</text><text x="71" y="834" font-size="19" fill="#52697B" font-weight="400">Current grants checked at the gate</text><text x="71" y="862" font-size="19" fill="#52697B" font-weight="400">In-flight actions are reconciled</text><text x="71" y="890" font-size="19" fill="#52697B" font-weight="400">A stop is not an automatic undo</text><path d="M430 778 H475 V620 H505" fill="none" stroke="#AC4836" stroke-width="3"  marker-end="url(#ared)"/><rect x="972" y="989" width="380" height="145" rx="12" fill="#EEF4FC" stroke="none"/><text x="995" y="1019" font-size="15" fill="#52697B" font-weight="700">AUTHORITATIVE STATE CHECK</text><text x="995" y="1055" font-size="25" fill="#173047" font-weight="700">Verified / failed / unknown</text><text x="995" y="1092" font-size="19" fill="#52697B" font-weight="400">Unknown → named recovery owner</text><text x="995" y="1120" font-size="19" fill="#52697B" font-weight="400">Completion requires verified effect</text><path d="M1160 904 V985" fill="none" stroke="#087B73" stroke-width="3"  marker-end="url(#ateal)"/><rect x="48" y="988" width="842" height="147" rx="12" fill="#EEF4FC" stroke="none"/><text x="72" y="1025" font-size="17" fill="#295FA7" font-weight="700">OBSERVE THE ACTION, NOT JUST THE MODEL CALL</text><text x="72" y="1064" font-size="21" fill="#52697B" font-weight="400">Exact proposal and approval · grant/policy decisions · operation receipt</text><text x="72" y="1097" font-size="21" fill="#52697B" font-weight="400">Verified outcome or exception · evaluator/rubric versions</text><path d="M970 1080 H894" fill="none" stroke="#295FA7" stroke-width="3"  marker-end="url(#ablue)"/><rect x="48" y="1170" width="1304" height="92" rx="12" fill="#173047" stroke="none"/><text x="72" y="1206" font-size="16" fill="#B5D3DF" font-weight="700">LINKED EVIDENCE</text><text x="72" y="1239" font-size="23" fill="white" font-weight="600">case_id → proposal → authority / approval → operation_id → outcome → evaluation / review</text><path d="M48 1285 H1352" stroke="#D6E2EA"/><text x="48" y="1314" font-size="16" fill="#52697B" font-weight="400">Earned Autonomy · Operating architecture</text><text x="1090" y="1314" font-size="16" fill="#52697B" font-weight="400">Mohit Mittal · 2026</text></svg>