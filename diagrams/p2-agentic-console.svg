<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1200" viewBox="0 0 1400 1200" font-family="Segoe UI,Arial,sans-serif"><defs><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087B73"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#295FA7"/></marker><marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#98621B"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#AC4836"/></marker></defs><rect x="1" y="1" width="1398" height="1198" fill="white" stroke="#D6E2EA" rx="18"/><text x="48" y="63" font-size="34" fill="#173047" font-weight="700">Is the restriction in force?</text><text x="48" y="104" font-size="21" fill="#536B7C" font-weight="400">Operators see effective permissions by action and cohort, plus scoped holds and unresolved work.</text><rect x="48" y="150" width="1304" height="91" fill="#173047" stroke="none" rx="13"/><text x="73" y="187" font-size="20" fill="white" font-weight="700">SERVICING INVESTIGATOR · VERSIONED CONFIGURATION</text><text x="73" y="219" font-size="20" fill="#C2D8E3" font-weight="400">Owner: advisor servicing     |     Scope: eligible service cases     |     Modes: mixed by action</text><text x="70" y="289" font-size="16" fill="#536B7C" font-weight="700">ACTION / GRANT</text><text x="582" y="289" font-size="16" fill="#536B7C" font-weight="700">CURRENT MODE</text><text x="865" y="289" font-size="16" fill="#536B7C" font-weight="700">PENDING DECISION / CONTROL</text><rect x="48" y="309" width="1304" height="108" fill="#EEF4FC" stroke="none" rx="13"/><text x="70" y="352" font-size="26" fill="#173047" font-weight="700">Create specialist follow-up</text><text x="70" y="391" font-size="19" fill="#536B7C" font-weight="400">Current grant · approved types and queues</text><text x="582" y="353" font-size="21" fill="#295FA7" font-weight="700">A2 · Approval required</text><text x="865" y="352" font-size="24" fill="#173047" font-weight="700">A3 requested; retain A2</text><text x="865" y="392" font-size="19" fill="#536B7C" font-weight="400">Necessity / routing evidence incomplete</text><rect x="48" y="434" width="1304" height="108" fill="#FCF3E2" stroke="none" rx="13"/><text x="70" y="477" font-size="26" fill="#173047" font-weight="700">Mailing-address update</text><text x="70" y="516" font-size="19" fill="#536B7C" font-weight="400">A2 grant · separate per-update approval</text><text x="582" y="478" font-size="21" fill="#295FA7" font-weight="700">A2 · Approval required</text><text x="865" y="477" font-size="24" fill="#AC4836" font-weight="700">SC-42 hold requested</text><text x="865" y="517" font-size="18" fill="#AC4836" font-weight="400">Shared-harness acknowledgment pending</text><rect x="48" y="577" width="626" height="368" fill="#E7F5F0" stroke="none" rx="13"/><text x="73" y="617" font-size="16" fill="#087B73" font-weight="700">PROMOTION PACKET</text><text x="73" y="657" font-size="27" fill="#173047" font-weight="700">Does delegation remove total work?</text><text x="73" y="704" font-size="22" fill="#536B7C" font-weight="400">Scope + versions + evidence window</text><text x="73" y="744" font-size="22" fill="#536B7C" font-weight="400">Reviewed necessity / routing / completion</text><text x="73" y="784" font-size="22" fill="#536B7C" font-weight="400">Sampling and severity-specific errors</text><text x="73" y="824" font-size="22" fill="#536B7C" font-weight="400">Handling, review, exceptions and rework</text><text x="73" y="864" font-size="22" fill="#536B7C" font-weight="400">Policy ceiling, owner and decision record</text><text x="73" y="925" font-size="20" fill="#087B73" font-weight="600">Owner keeps A2 until the evidence supports delegation.</text><rect x="726" y="577" width="626" height="368" fill="#FCEFEB" stroke="none" rx="13"/><text x="751" y="617" font-size="16" fill="#AC4836" font-weight="700">LIVE OPERATION / RESTRICTION</text><text x="751" y="657" font-size="27" fill="#173047" font-weight="700">OP-42 · outcome UNKNOWN</text><text x="751" y="704" font-size="22" fill="#536B7C" font-weight="400">Recovery owner: account operations</text><text x="751" y="744" font-size="22" fill="#536B7C" font-weight="400">Scope: new SC-42 address updates</text><text x="751" y="784" font-size="22" fill="#536B7C" font-weight="400">Enforcement confirmation: PENDING</text><text x="751" y="824" font-size="22" fill="#536B7C" font-weight="400">In-flight outcome: reconcile by operation ID</text><text x="751" y="864" font-size="22" fill="#536B7C" font-weight="400">Request submitted; outcome still unknown.</text><rect x="48" y="982" width="1304" height="110" fill="#EEF4FC" stroke="none" rx="13"/><text x="73" y="1020" font-size="17" fill="#295FA7" font-weight="700">DRILL THROUGH TO THE EVIDENCE</text><text x="73" y="1060" font-size="23" fill="#536B7C" font-weight="400">Quality and effort by cohort · pending-outcome age · review load · request-to-enforcement delay</text><path d="M48 1145 H1352" stroke="#D6E2EA"/><text x="48" y="1174" font-size="16" fill="#536B7C" font-weight="400">Earned Autonomy · Operating architecture</text><text x="1092" y="1174" font-size="16" fill="#536B7C" font-weight="400">Mohit Mittal · 2026</text></svg>