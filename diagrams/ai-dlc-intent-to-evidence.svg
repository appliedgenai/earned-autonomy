<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#107B73"/></marker></defs><rect x="1" y="1" width="1198" height="838" rx="18" fill="white" stroke="#DCE3EB" stroke-width="2"/><text x="48" y="60" fill="#1C2633" font-size="33" font-weight="700">AI-DLC: from intent to evidence</text><text x="48" y="99" fill="#5E6D7D" font-size="19" font-weight="400">One business promise survives specification, construction, release and operation.</text><rect x="48" y="130" width="1104" height="58" rx="12" fill="#1C2633" stroke="#1C2633" stroke-width="1.5"/><text x="69" y="166" fill="white" font-size="22" font-weight="600">INTENT   Reduce address-maintenance effort without weakening account controls.</text><rect x="48" y="218" width="348" height="293" rx="12" fill="#EFF4FC" stroke="none" stroke-width="1.5"/><text x="70" y="257" fill="#315FAA" font-size="22" font-weight="700">01</text><text x="70" y="294" fill="#1C2633" font-size="25" font-weight="700">Make intent testable</text><text x="70" y="322" fill="#5E6D7D" font-size="16" font-weight="400">Product + domain + engineering</text><text x="70" y="369" fill="#1C2633" font-size="17" font-weight="400">Outcome and eligible population</text><text x="70" y="401" fill="#1C2633" font-size="17" font-weight="400">Scope, exclusions and risk</text><text x="70" y="433" fill="#1C2633" font-size="17" font-weight="400">Acceptance and failure cases</text><line x1="70" y1="459" x2="374" y2="459" stroke="#DCE3EB" stroke-width="1.5"/><text x="70" y="487" fill="#315FAA" font-size="16" font-weight="600">Approved intent + evaluation cases</text><rect x="426" y="218" width="348" height="293" rx="12" fill="#F5F7FA" stroke="none" stroke-width="1.5"/><text x="448" y="257" fill="#1C2633" font-size="22" font-weight="700">02</text><text x="448" y="294" fill="#1C2633" font-size="25" font-weight="700">Construct within bounds</text><text x="448" y="322" fill="#5E6D7D" font-size="16" font-weight="400">Engineering + shared platform</text><text x="448" y="369" fill="#1C2633" font-size="17" font-weight="400">Authoritative, scoped context</text><text x="448" y="401" fill="#1C2633" font-size="17" font-weight="400">Small changes in isolated workspaces</text><text x="448" y="433" fill="#1C2633" font-size="17" font-weight="400">Independent tests and review</text><line x1="448" y1="459" x2="752" y2="459" stroke="#DCE3EB" stroke-width="1.5"/><text x="448" y="487" fill="#1C2633" font-size="16" font-weight="600">Reviewed change + release manifest</text><rect x="804" y="218" width="348" height="293" rx="12" fill="#E6F3F0" stroke="none" stroke-width="1.5"/><text x="826" y="257" fill="#107B73" font-size="22" font-weight="700">03</text><text x="826" y="294" fill="#1C2633" font-size="25" font-weight="700">Verify the outcome</text><text x="826" y="322" fill="#5E6D7D" font-size="16" font-weight="400">Service owner + operations</text><text x="826" y="369" fill="#1C2633" font-size="17" font-weight="400">Controlled rollout and recovery</text><text x="826" y="401" fill="#1C2633" font-size="17" font-weight="400">Confirmed state or owned exception</text><text x="826" y="433" fill="#1C2633" font-size="17" font-weight="400">Quality, human effort and cost</text><line x1="826" y1="459" x2="1130" y2="459" stroke="#DCE3EB" stroke-width="1.5"/><text x="826" y="487" fill="#107B73" font-size="16" font-weight="600">Observed result + curated learning</text><path d="M 397 362 L 418 362" fill="none" stroke="#107B73" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M 775 362 L 796 362" fill="none" stroke="#107B73" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="48" y="536" width="1104" height="82" rx="12" fill="#E6F3F0" stroke="none" stroke-width="1.5"/><text x="70" y="568" fill="#107B73" font-size="15" font-weight="700">THE EVIDENCE CHAIN</text><text x="70" y="596" fill="#1C2633" font-size="21" font-weight="600">Intent version → context manifest → change → tests → release → verified outcome</text><path d="M 1050 632 L 1050 658 L 185 658 L 185 632" fill="none" stroke="#107B73" stroke-width="2.8" marker-end="url(#arrow)"/><text x="365" y="651" fill="#107B73" font-size="17" font-weight="600">Reviewed failures become new acceptance cases</text><rect x="48" y="692" width="350" height="67" rx="12" fill="#EFF4FC" stroke="none" stroke-width="1.5"/><text x="67" y="719" fill="#315FAA" font-size="14" font-weight="700">PEOPLE</text><text x="67" y="745" fill="#1C2633" font-size="17" font-weight="400">Named owners and review capacity</text><rect x="424" y="692" width="350" height="67" rx="12" fill="#F5F7FA" stroke="none" stroke-width="1.5"/><text x="443" y="719" fill="#5E6D7D" font-size="14" font-weight="700">PROCESS</text><text x="443" y="745" fill="#1C2633" font-size="17" font-weight="400">Small batches and risk-based gates</text><rect x="800" y="692" width="352" height="67" rx="12" fill="#E6F3F0" stroke="none" stroke-width="1.5"/><text x="819" y="719" fill="#107B73" font-size="14" font-weight="700">TECHNOLOGY</text><text x="819" y="745" fill="#1C2633" font-size="17" font-weight="400">Bounded tools and correlated evidence</text><line x1="48" y1="786" x2="1152" y2="786" stroke="#DCE3EB" stroke-width="1.5"/><text x="48" y="816" fill="#5E6D7D" font-size="15" font-weight="400">Independent reference architecture • Synthetic example</text><text x="865" y="816" fill="#5E6D7D" font-size="15" font-weight="400">Mohit Mittal · September 2026</text></svg>