<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="835" viewBox="0 0 1200 835" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#107B73"/></marker></defs><rect x="1" y="1" width="1198" height="833" rx="18" fill="white" stroke="#DCE3EB" stroke-width="2"/><text x="48" y="60" fill="#1C2633" font-size="33" font-weight="700">Observe the agent. Verify the business result.</text><text x="48" y="99" fill="#5E6D7D" font-size="19" font-weight="400">Three connected views • Separate access and retention • One versioned release identity</text><rect x="48" y="150" width="1104" height="159" rx="12" fill="#EFF4FC" stroke="none" stroke-width="1.5"/><text x="68" y="181" fill="#315FAA" font-size="16" font-weight="700">DELIVERY</text><text x="218" y="181" fill="#5E6D7D" font-size="18" font-weight="400">Did we build the right change?</text><rect x="68" y="202" width="342" height="84" rx="9" fill="white" stroke="#DCE3EB" stroke-width="1.5"/><text x="85" y="234" fill="#1C2633" font-size="22" font-weight="600">Intent + context</text><text x="85" y="263" fill="#5E6D7D" font-size="16" font-weight="400">Scope and source versions</text><path d="M 414 244 L 428 244" fill="none" stroke="#107B73" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="433" y="202" width="342" height="84" rx="9" fill="white" stroke="#DCE3EB" stroke-width="1.5"/><text x="450" y="234" fill="#1C2633" font-size="22" font-weight="600">Change + tests</text><text x="450" y="263" fill="#5E6D7D" font-size="16" font-weight="400">Tool runs, diffs, evaluations</text><path d="M 779 244 L 793 244" fill="none" stroke="#107B73" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="798" y="202" width="342" height="84" rx="9" fill="white" stroke="#DCE3EB" stroke-width="1.5"/><text x="815" y="234" fill="#1C2633" font-size="22" font-weight="600">Release identity</text><text x="815" y="263" fill="#5E6D7D" font-size="16" font-weight="400">Code, prompts, models, tools</text><rect x="48" y="345" width="1104" height="159" rx="12" fill="#E6F3F0" stroke="none" stroke-width="1.5"/><text x="68" y="376" fill="#107B73" font-size="16" font-weight="700">RUNTIME</text><text x="218" y="376" fill="#5E6D7D" font-size="18" font-weight="400">What happened when it acted?</text><rect x="68" y="397" width="342" height="84" rx="9" fill="white" stroke="#DCE3EB" stroke-width="1.5"/><text x="85" y="429" fill="#1C2633" font-size="22" font-weight="600">Request + actor</text><text x="85" y="458" fill="#5E6D7D" font-size="16" font-weight="400">Account scope and delegation</text><path d="M 414 439 L 428 439" fill="none" stroke="#107B73" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="433" y="397" width="342" height="84" rx="9" fill="white" stroke="#DCE3EB" stroke-width="1.5"/><text x="450" y="429" fill="#1C2633" font-size="22" font-weight="600">Policy + execution</text><text x="450" y="458" fill="#5E6D7D" font-size="16" font-weight="400">Approval, tool call, receipt</text><path d="M 779 439 L 793 439" fill="none" stroke="#107B73" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="798" y="397" width="342" height="84" rx="9" fill="white" stroke="#DCE3EB" stroke-width="1.5"/><text x="815" y="429" fill="#1C2633" font-size="22" font-weight="600">Verified state</text><text x="815" y="458" fill="#5E6D7D" font-size="16" font-weight="400">Completed, partial or unknown</text><rect x="48" y="540" width="1104" height="159" rx="12" fill="#FBF2DE" stroke="none" stroke-width="1.5"/><text x="68" y="571" fill="#AE740E" font-size="16" font-weight="700">OUTCOME</text><text x="218" y="571" fill="#5E6D7D" font-size="18" font-weight="400">Did the work create value?</text><rect x="68" y="592" width="342" height="84" rx="9" fill="white" stroke="#DCE3EB" stroke-width="1.5"/><text x="85" y="624" fill="#1C2633" font-size="22" font-weight="600">Correct completion</text><text x="85" y="653" fill="#5E6D7D" font-size="16" font-weight="400">Eligible and unresolved cases</text><path d="M 414 634 L 428 634" fill="none" stroke="#107B73" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="433" y="592" width="342" height="84" rx="9" fill="white" stroke="#DCE3EB" stroke-width="1.5"/><text x="450" y="624" fill="#1C2633" font-size="22" font-weight="600">Human effort</text><text x="450" y="653" fill="#5E6D7D" font-size="16" font-weight="400">Handling, review, exceptions</text><path d="M 779 634 L 793 634" fill="none" stroke="#107B73" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="798" y="592" width="342" height="84" rx="9" fill="white" stroke="#DCE3EB" stroke-width="1.5"/><text x="815" y="624" fill="#1C2633" font-size="22" font-weight="600">Total economics</text><text x="815" y="653" fill="#5E6D7D" font-size="16" font-weight="400">Adoption, platform and run cost</text><path d="M 987 312 L 987 338" fill="none" stroke="#107B73" stroke-width="2.8" marker-end="url(#arrow)"/><text x="510" y="332" fill="#107B73" font-size="16" font-weight="600">Link production behavior to its released configuration</text><path d="M 987 507 L 987 533" fill="none" stroke="#107B73" stroke-width="2.8" marker-end="url(#arrow)"/><text x="510" y="527" fill="#107B73" font-size="16" font-weight="600">Join outcomes by authorized correlation identifiers</text><text x="48" y="741" fill="#1C2633" font-size="24" font-weight="700">A successful model response is not a successful business transaction.</text><line x1="48" y1="781" x2="1152" y2="781" stroke="#DCE3EB" stroke-width="1.5"/><text x="48" y="811" fill="#5E6D7D" font-size="15" font-weight="400">Independent reference architecture • Synthetic example</text><text x="865" y="811" fill="#5E6D7D" font-size="15" font-weight="400">Mohit Mittal · September 2026</text></svg>