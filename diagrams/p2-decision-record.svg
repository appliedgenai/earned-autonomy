<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" font-family="Segoe UI,Arial,sans-serif"><defs><marker id="ateal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087B73"/></marker><marker id="ablue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#295FA7"/></marker><marker id="ared" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#AC4836"/></marker><marker id="aamber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#98621B"/></marker></defs><rect x="1" y="1" width="1398" height="1078" rx="18" fill="white" stroke="#D6E2EA"/><text x="48" y="63" font-size="36" fill="#173047" font-weight="700">Reconstructing one account update</text><text x="48" y="102" font-size="21" fill="#52697B" font-weight="400">SC-42 · Inspect the linked records to reconstruct the decision and outcome.</text><rect x="48" y="151" width="1304" height="112" rx="12" fill="#E7F5F0" stroke="none"/><text x="72" y="186" font-size="16" fill="#087B73" font-weight="700">WHO / SCOPE</text><text x="72" y="219" font-size="21" fill="#173047" font-weight="400">Authorized advisor through servicing assistant; eligible account scope.</text><text x="72" y="249" font-size="21" fill="#173047" font-weight="400">Case SC-42 · mailing-address update.</text><rect x="48" y="277" width="1304" height="112" rx="12" fill="#EEF4FC" stroke="none"/><text x="72" y="312" font-size="16" fill="#295FA7" font-weight="700">EXACT PROPOSAL</text><text x="72" y="345" font-size="21" fill="#173047" font-weight="400">Versioned proposal binds target, exact field changes, sources and record revision.</text><text x="72" y="375" font-size="21" fill="#173047" font-weight="400">Sensitive before/after payload retained in the controlled evidence store.</text><rect x="48" y="403" width="1304" height="112" rx="12" fill="#E7F5F0" stroke="none"/><text x="72" y="438" font-size="16" fill="#087B73" font-weight="700">AUTHORITY / APPROVAL</text><text x="72" y="471" font-size="21" fill="#173047" font-weight="400">Current grant and policy; human approval binds the exact versioned proposal.</text><text x="72" y="501" font-size="21" fill="#173047" font-weight="400">Approving actor, expiry and fresh execution checks are recorded.</text><rect x="48" y="529" width="1304" height="112" rx="12" fill="#EEF4FC" stroke="none"/><text x="72" y="564" font-size="16" fill="#295FA7" font-weight="700">EXECUTION</text><text x="72" y="597" font-size="21" fill="#173047" font-weight="400">OP-42 binds the approved payload and duplicate-prevention key.</text><text x="72" y="627" font-size="21" fill="#173047" font-weight="400">Dispatch receipt times out → outcome UNKNOWN; no blind second write.</text><rect x="48" y="655" width="1304" height="112" rx="12" fill="#E7F5F0" stroke="none"/><text x="72" y="690" font-size="16" fill="#087B73" font-weight="700">VERIFIED OUTCOME</text><text x="72" y="723" font-size="21" fill="#173047" font-weight="400">Operation lookup and authoritative state confirm the approved effect.</text><text x="72" y="753" font-size="21" fill="#173047" font-weight="400">Outcome becomes VERIFIED; the verification record resolves OP-42.</text><rect x="48" y="781" width="1304" height="112" rx="12" fill="#EEF4FC" stroke="none"/><text x="72" y="816" font-size="16" fill="#295FA7" font-weight="700">EVALUATION / LEARNING</text><text x="72" y="849" font-size="21" fill="#173047" font-weight="400">Rubric and judge/model versions, verdict and reviewer disposition are linked.</text><text x="72" y="879" font-size="21" fill="#173047" font-weight="400">Any behavior fix or authority change has a separate versioned decision.</text><text x="48" y="951" font-size="21" fill="#52697B" font-weight="400">A verified update completes the action. SC-42 closure has separate resolution conditions and authorization.</text><text x="48" y="987" font-size="20" fill="#52697B" font-weight="400">Required records have access, retention and integrity controls. Trace completeness does not prove correctness.</text><path d="M48 1025 H1352" stroke="#D6E2EA"/><text x="48" y="1054" font-size="16" fill="#52697B" font-weight="400">Earned Autonomy · Operating architecture</text><text x="1090" y="1054" font-size="16" fill="#52697B" font-weight="400">Mohit Mittal · 2026</text></svg>