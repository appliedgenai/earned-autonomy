<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1115" viewBox="0 0 1400 1115" font-family="Segoe UI,Arial,sans-serif"><defs><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087B73"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#295FA7"/></marker><marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#98621B"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#AC4836"/></marker></defs><rect x="1" y="1" width="1398" height="1113" fill="white" stroke="#D6E2EA" rx="18"/><text x="48" y="63" font-size="34" fill="#173047" font-weight="700">Where permission is enforced</text><text x="48" y="104" font-size="21" fill="#536B7C" font-weight="400">Registration connects identity, configuration, tools, grants, evaluations and operational ownership.</text><rect x="48" y="157" width="380" height="126" fill="#EEF4FC" stroke="none" rx="13"/><text x="71" y="200" font-size="25" fill="#173047" font-weight="700">Servicing investigator</text><text x="71" y="242" font-size="20" fill="#536B7C" font-weight="400">Versioned case/action grants</text><path d="M238 286 V351" stroke="#087B73" stroke-width="3" fill="none" marker-end="url(#teal)"/><rect x="510" y="157" width="380" height="126" fill="#EEF4FC" stroke="none" rx="13"/><text x="533" y="200" font-size="25" fill="#173047" font-weight="700">Another registered agent</text><text x="533" y="242" font-size="20" fill="#536B7C" font-weight="400">Its own scope, grants and tests</text><path d="M700 286 V351" stroke="#087B73" stroke-width="3" fill="none" marker-end="url(#teal)"/><rect x="972" y="157" width="380" height="126" fill="#EEF4FC" stroke="none" rx="13"/><text x="995" y="200" font-size="25" fill="#173047" font-weight="700">Another runtime / provider</text><text x="995" y="242" font-size="20" fill="#536B7C" font-weight="400">Admit only supported controls</text><path d="M1162 286 V351" stroke="#087B73" stroke-width="3" fill="none" marker-end="url(#teal)"/><rect x="48" y="355" width="1304" height="251" fill="#173047" stroke="none" rx="13"/><text x="73" y="393" font-size="17" fill="#BDD6E1" font-weight="700">SHARED HARNESS · VERSIONED CONFIGURATION PER AGENT</text><rect x="73" y="416" width="404" height="165" fill="#25465E" stroke="none" rx="13"/><text x="93" y="451" font-size="25" fill="white" font-weight="700">Access and tools</text><text x="93" y="490" font-size="20" fill="#C2D8E3" font-weight="400">Identity + delegated scope</text><text x="93" y="521" font-size="20" fill="#C2D8E3" font-weight="400">Permitted context and tools</text><text x="93" y="552" font-size="20" fill="#C2D8E3" font-weight="400">Time / volume / cost limits</text><rect x="503" y="416" width="404" height="165" fill="#25465E" stroke="none" rx="13"/><text x="523" y="451" font-size="25" fill="white" font-weight="700">Action dispatch</text><text x="523" y="490" font-size="20" fill="#C2D8E3" font-weight="400">Current grant + required checks</text><text x="523" y="521" font-size="20" fill="#C2D8E3" font-weight="400">Exact approval when required</text><text x="523" y="552" font-size="20" fill="#C2D8E3" font-weight="400">Restrictions fail closed</text><rect x="933" y="416" width="404" height="165" fill="#25465E" stroke="none" rx="13"/><text x="953" y="451" font-size="25" fill="white" font-weight="700">Execution and recovery</text><text x="953" y="490" font-size="20" fill="#C2D8E3" font-weight="400">Durable operation identity</text><text x="953" y="521" font-size="20" fill="#C2D8E3" font-weight="400">Destination guarantees</text><text x="953" y="552" font-size="20" fill="#C2D8E3" font-weight="400">Verified result or owned exception</text><path d="M234 609 V738" stroke="#087B73" stroke-width="3" fill="none" marker-end="url(#teal)"/><path d="M1300 738 V645 H1250 V610" stroke="#98621B" stroke-width="3" fill="none" marker-end="url(#amber)"/><text x="910" y="633" font-size="17" fill="#98621B" font-weight="600">Authorized grant / restriction</text><path d="M848 610 V689 H1108 V738" stroke="#295FA7" stroke-width="3" fill="none" marker-end="url(#blue)"/><text x="790" y="715" font-size="17" fill="#295FA7" font-weight="600">Effective grant + acknowledgment</text><rect x="48" y="742" width="380" height="195" fill="#EEF4FC" stroke="none" rx="13"/><text x="71" y="786" font-size="26" fill="#173047" font-weight="700">Evidence</text><text x="71" y="832" font-size="19" fill="#536B7C" font-weight="400">Case → proposal → operation</text><text x="71" y="863" font-size="19" fill="#536B7C" font-weight="400">Grant / approval / versions</text><text x="71" y="894" font-size="19" fill="#536B7C" font-weight="400">Outcome, exceptions and effort</text><path d="M432 841 H503" stroke="#087B73" stroke-width="3" fill="none" marker-end="url(#teal)"/><rect x="510" y="742" width="380" height="195" fill="#E7F5F0" stroke="none" rx="13"/><text x="533" y="786" font-size="26" fill="#173047" font-weight="700">Continuous evaluation</text><text x="533" y="832" font-size="19" fill="#536B7C" font-weight="400">Outcome monitoring</text><text x="533" y="863" font-size="19" fill="#536B7C" font-weight="400">Sampled semantic + domain review</text><text x="533" y="894" font-size="19" fill="#536B7C" font-weight="400">Offline candidate requalification</text><path d="M894 841 H965" stroke="#087B73" stroke-width="3" fill="none" marker-end="url(#teal)"/><rect x="972" y="742" width="380" height="195" fill="#FCF3E2" stroke="none" rx="13"/><text x="995" y="786" font-size="26" fill="#173047" font-weight="700">Agentic console</text><text x="995" y="832" font-size="19" fill="#536B7C" font-weight="400">Owner reviews permission changes</text><text x="995" y="863" font-size="19" fill="#536B7C" font-weight="400">Operations handles exceptions</text><text x="995" y="894" font-size="19" fill="#536B7C" font-weight="400">Requested ≠ confirmed restriction</text><text x="48" y="989" font-size="23" fill="#173047" font-weight="600">The shared harness and destination services enforce authorized decisions.</text><text x="48" y="1025" font-size="20" fill="#536B7C" font-weight="400">Enable an execution mode only after its integration demonstrates the required controls.</text><path d="M48 1061 H1352" stroke="#D6E2EA"/><text x="48" y="1090" font-size="16" fill="#536B7C" font-weight="400">Earned Autonomy · Operating architecture</text><text x="1092" y="1090" font-size="16" fill="#536B7C" font-weight="400">Mohit Mittal · 2026</text></svg>